<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:96px minmax(0,1fr) 200px 220px;gap:32px;padding:28px 0;border-bottom:1px solid #D9D6CF;align-items:center;font-family:'Public Sans',sans-serif;color:#282058">
<div style="border-top:3px solid {{ bc }};padding-top:10px;display:flex;flex-direction:column;gap:2px"><span style="font:500 26px/1.1 'IBM Plex Mono',monospace">{{ day }}</span><span style="font:400 12px 'IBM Plex Mono',monospace;color:#5A5872">{{ month }}</span></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font:600 12px 'Public Sans',sans-serif;letter-spacing:.12em;color:#0C5F98">{{ type }}</span><span style="font:600 22px/1.3 'Public Sans',sans-serif">{{ title }}</span><span style="font:400 12px 'IBM Plex Mono',monospace;color:#5A5872">{{ extras }}</span></div>
<div style="display:flex;flex-direction:column;gap:10px;font:400 13px/1.5 'IBM Plex Mono',monospace"><span><span style="font:600 12px 'Public Sans',sans-serif;color:#5A5872;display:block">Hình thức</span>{{ format }}</span><span><span style="font:600 12px 'Public Sans',sans-serif;color:#5A5872;display:block">Diễn giả</span>{{ speaker }}</span></div>
<div style="display:flex;justify-content:flex-end"><span tabindex="0" style="{{ ctaStyle }}" style-focus="outline:2px solid #1078BF;outline-offset:3px">{{ cta }}</span></div>
</div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<div style="padding:22px 0;border-bottom:1px solid #D9D6CF;display:flex;flex-direction:column;gap:14px;font-family:'Public Sans',sans-serif;color:#282058">
<div style="display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start">
<div style="border-top:3px solid {{ bc }};padding-top:8px;display:flex;flex-direction:column"><span style="font:500 20px/1.1 'IBM Plex Mono',monospace">{{ day }}</span><span style="font:400 11px 'IBM Plex Mono',monospace;color:#5A5872">{{ month }}</span></div>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 11px 'Public Sans',sans-serif;letter-spacing:.12em;color:#0C5F98">{{ type }}</span><span style="font:600 18px/1.3 'Public Sans',sans-serif">{{ title }}</span></div></div>
<div style="display:flex;flex-direction:column;gap:4px;font:400 12px/1.6 'IBM Plex Mono',monospace;color:#4A4766"><span>{{ format }} · {{ speaker }}</span><span style="color:#5A5872">{{ extras }}</span></div>
<span tabindex="0" style="{{ mCtaStyle }}" style-focus="outline:2px solid #1078BF;outline-offset:2px">{{ cta }}</span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1248,&quot;height&quot;:150},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;upcoming&quot;,&quot;past&quot;],&quot;default&quot;:&quot;upcoming&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;WEBINAR&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Tên sự kiện]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;day&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[DD]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;month&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[MM/YYYY]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;format&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Hình thức]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;speaker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Diễn giả]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;extras&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, m = !!p.mobile, past = p.status === 'past';
    return {
      mobile: m, desktop: !m, bc: past ? '#8B88A6' : '#1078BF',
      day: p.day ?? '[DD]', month: p.month ?? '[MM/YYYY]', type: p.type ?? 'WEBINAR',
      title: p.title ?? '[Tên sự kiện]', format: p.format ?? '[Hình thức]', speaker: p.speaker ?? '[Diễn giả]',
      extras: past ? (p.extras ?? 'Recording · Slide · Checklist · Bài viết liên quan (nếu có)') : '',
      cta: p.cta ?? (past ? 'Xem tài liệu sự kiện →' : 'Đăng ký tham dự →'),
      ctaStyle: past ? "font:600 15px 'Public Sans',sans-serif;border-bottom:2px solid #F89018;padding-bottom:3px;cursor:pointer;min-height:24px" : "background:#1078BF;color:#fff;min-height:52px;padding:0 24px;display:flex;align-items:center;font:600 15px 'Public Sans',sans-serif;cursor:pointer",
      mCtaStyle: past ? "min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid #282058;font:600 15px 'Public Sans',sans-serif" : "min-height:52px;display:flex;align-items:center;justify-content:center;background:#1078BF;color:#fff;font:600 15px 'Public Sans',sans-serif"
    };
  }
}
</script>
</body>
</html>
