<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="padding:96px;display:flex;flex-direction:column;gap:48px;font-family:'Public Sans',sans-serif;color:#282058">
<div style="display:grid;grid-template-columns:4fr 8fr;gap:96px"><div style="font:500 36px/1.15 'Newsreader',serif">Năng lực đã được kiểm chứng qua dự án</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;border-top:2px solid #282058;padding-top:22px"><sc-for list="{{ mets }}" as="m" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:6px"><span style="font:500 40px/1 'Newsreader',serif;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;background:#F89018"></span>[CASE DATA]</span><span style="font:400 14px 'Public Sans',sans-serif;color:#4A4766">{{ m }}</span></div></sc-for></div></div>
<div style="display:grid;grid-template-columns:4fr 8fr;gap:96px"><div style="font:600 12px 'Public Sans',sans-serif;letter-spacing:.12em;color:#0C5F98;padding-top:22px">KHÁCH HÀNG TIÊU BIỂU</div>
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid #D9D6CF;border-left:1px solid #D9D6CF"><sc-for list="{{ logos }}" as="l" hint-placeholder-count="6"><div style="height:80px;border-right:1px solid #D9D6CF;border-bottom:1px solid #D9D6CF;display:flex;align-items:center;justify-content:center;font:400 11px/1.4 'IBM Plex Mono',monospace;color:#5A5872;text-align:center;padding:8px">[LOGO {{ l }}]</div></sc-for></div></div>
<div style="display:grid;grid-template-columns:4fr 8fr;gap:96px"><div style="font:600 12px 'Public Sans',sans-serif;letter-spacing:.12em;color:#0C5F98">TIÊU CHUẨN &amp; FRAMEWORK</div><div style="font:400 14px 'IBM Plex Mono',monospace;color:#5A5872">[NỘI DUNG — liệt kê tiêu chuẩn và framework áp dụng]</div></div>
</div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<div style="padding:48px 20px;display:flex;flex-direction:column;gap:28px;font-family:'Public Sans',sans-serif;color:#282058">
<div style="font:500 26px/1.15 'Newsreader',serif">Năng lực đã được kiểm chứng qua dự án</div>
<div style="border-top:2px solid #282058"><sc-for list="{{ mets }}" as="m" hint-placeholder-count="4"><div style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid #D9D6CF;min-height:56px"><span style="font:400 14px 'Public Sans',sans-serif;color:#4A4766">{{ m }}</span><span style="font:500 26px 'Newsreader',serif;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;background:#F89018"></span>[CASE DATA]</span></div></sc-for></div>
<div style="font:600 11px 'Public Sans',sans-serif;letter-spacing:.12em;color:#0C5F98">KHÁCH HÀNG TIÊU BIỂU</div>
<div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #D9D6CF;border-left:1px solid #D9D6CF"><sc-for list="{{ logos4 }}" as="l" hint-placeholder-count="4"><div style="height:72px;border-right:1px solid #D9D6CF;border-bottom:1px solid #D9D6CF;display:flex;align-items:center;justify-content:center;font:400 11px 'IBM Plex Mono',monospace;color:#5A5872">[LOGO {{ l }}]</div></sc-for></div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:480},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { const m = !!this.props.mobile; return { mobile: m, desktop: !m, mets: ['Dự án đã triển khai', 'Ngành sản xuất', 'Năm kinh nghiệm', 'Khách hàng'], logos: [1, 2, 3, 4, 5, 6], logos4: [1, 2, 3, 4] }; }
}
</script>
</body>
</html>
