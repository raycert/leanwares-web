<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:170px minmax(0,1fr) 190px;gap:28px;padding:28px 16px;border-bottom:1px solid #D9D6CF;align-items:start;background:{{ bg }};outline:{{ ol }};outline-offset:-2px;font-family:'Public Sans',sans-serif;color:#282058">
<div style="display:flex;align-items:center;gap:10px;padding-top:5px"><span style="width:10px;height:10px;background:#1078BF"></span><span style="font:600 12px 'Public Sans',sans-serif;letter-spacing:.1em;color:#0C5F98">{{ type }}</span></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="font:600 22px/1.3 'Public Sans',sans-serif">{{ title }}</div><div style="font:400 15px/1.6 'Public Sans',sans-serif;color:#4A4766">{{ desc }}</div><div style="font:400 12px 'IBM Plex Mono',monospace;color:#5A5872;padding-top:4px">{{ meta }}</div></div>
<div style="justify-self:end;padding-top:4px"><span style="font:600 14px 'Public Sans',sans-serif;border-bottom:2px solid {{ cb }};padding-bottom:3px;color:#282058">{{ cta }} →</span></div>
</div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<div style="padding:20px 12px;border-bottom:1px solid #D9D6CF;display:flex;flex-direction:column;gap:8px;background:{{ bg }};outline:{{ ol }};outline-offset:-2px;font-family:'Public Sans',sans-serif;color:#282058">
<div style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;background:#1078BF"></span><span style="font:600 11px 'Public Sans',sans-serif;letter-spacing:.1em;color:#0C5F98">{{ type }}</span></div>
<div style="font:600 18px/1.35 'Public Sans',sans-serif">{{ title }}</div><div style="font:400 14px/1.6 'Public Sans',sans-serif;color:#4A4766">{{ desc }}</div><div style="font:400 11px 'IBM Plex Mono',monospace;color:#5A5872">{{ meta }}</div>
<div style="min-height:44px;display:flex;align-items:center"><span style="font:600 14px 'Public Sans',sans-serif;border-bottom:2px solid {{ cb }};padding-bottom:2px">{{ cta }} →</span></div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1248,&quot;height&quot;:150},&quot;type&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CHECKLIST&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Checklist dữ liệu CBAM cho doanh nghiệp thép&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Mô tả ngắn 1–2 câu]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PDF + XLSX · Cập nhật 09/2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Xem tài liệu&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;hover&quot;,&quot;focus&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'default', m = !!this.props.mobile;
    return { mobile: m, desktop: !m,
      bg: s === 'hover' ? '#F6F5F2' : 'transparent',
      ol: s === 'focus' ? '2px solid #1078BF' : 'none',
      cb: s === 'hover' ? '#F89018' : 'transparent',
      cta: this.props.cta || 'Xem tài liệu' };
  }
}
</script>
</body>
</html>
