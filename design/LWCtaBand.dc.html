<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="background:#1078BF;color:#fff;padding:104px 96px;display:grid;grid-template-columns:8fr 4fr;gap:96px;align-items:end;font-family:'Public Sans',sans-serif">
<div style="font:500 60px/1.06 'Newsreader',serif;letter-spacing:-.02em;text-wrap:balance">{{ title }}</div>
<div style="background:#fff;color:#282058;padding:18px 30px;font:600 16px 'Public Sans',sans-serif;justify-self:start;border-bottom:3px solid #F89018">{{ btn }}</div>
</div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<div style="background:#1078BF;color:#fff;padding:56px 20px;display:flex;flex-direction:column;gap:28px;font-family:'Public Sans',sans-serif">
<div style="font:500 34px/1.08 'Newsreader',serif;letter-spacing:-.015em">{{ title }}</div>
<div style="background:#fff;color:#282058;padding:16px;text-align:center;font:600 15px 'Public Sans',sans-serif;border-bottom:3px solid #F89018;min-height:48px">{{ btn }}</div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:300},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nhà máy của bạn có thể giảm bao nhiêu phát thải?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;btn&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Đăng ký đánh giá sơ bộ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { const m = !!this.props.mobile; return { mobile: m, desktop: !m }; }
}
</script>
</body>
</html>
