<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:48px minmax(0,1fr) 32px;gap:16px;align-items:center;min-height:84px;border-top:1px solid #D9D6CF;font-family:'Public Sans',sans-serif;cursor:pointer">
<span style="font:500 13px 'IBM Plex Mono',monospace;color:#5A5872">{{ n }}</span>
<span style="font:600 26px/1.2 'Public Sans',sans-serif;color:{{ c }}">{{ t }}</span>
<span style="font:500 22px sans-serif;color:{{ c }};text-align:right">→</span>
</div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<div style="display:grid;grid-template-columns:36px minmax(0,1fr) 32px;gap:8px;align-items:center;min-height:60px;border-top:1px solid #D9D6CF;font-family:'Public Sans',sans-serif">
<span style="font:500 12px 'IBM Plex Mono',monospace;color:#5A5872">{{ n }}</span>
<span style="font:600 18px/1.25 'Public Sans',sans-serif;color:{{ c }}">{{ t }}</span>
<span style="font:500 18px sans-serif;color:{{ c }};text-align:right">{{ sign }}</span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:84},&quot;n&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;t&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Thép &amp; kim loại&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, m = !!p.mobile, a = !!p.active;
    return { mobile: m, desktop: !m, n: p.n ?? '01', t: p.t ?? 'Thép & kim loại', c: a ? '#0C5F98' : '#282058', sign: a ? '−' : '+' };
  }
}
</script>
</body>
</html>
