<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="padding:96px 96px;display:grid;grid-template-columns:4fr 8fr;gap:96px;font-family:'Public Sans',sans-serif;color:#282058">
<div style="font:500 36px/1.15 'Newsreader',serif">Liên quan đến nội dung này</div>
<div style="border-top:2px solid #282058"><sc-for list="{{ rel }}" as="r" hint-placeholder-count="6"><div style="display:grid;grid-template-columns:140px minmax(0,1fr) 24px;gap:20px;padding:20px 0;border-bottom:1px solid #D9D6CF;align-items:baseline"><span style="font:600 12px 'Public Sans',sans-serif;letter-spacing:.1em;color:#0C5F98">{{ r.k }}</span><span style="font:{{ r.f }};color:{{ r.c }}">{{ r.t }}</span><span style="color:#0C5F98">→</span></div></sc-for></div>
</div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<div style="padding:48px 20px;display:flex;flex-direction:column;gap:16px;font-family:'Public Sans',sans-serif;color:#282058">
<div style="font:500 26px/1.15 'Newsreader',serif">Liên quan đến nội dung này</div>
<div style="border-top:2px solid #282058"><sc-for list="{{ rel }}" as="r" hint-placeholder-count="6"><div style="min-height:64px;padding:14px 0;border-bottom:1px solid #D9D6CF;display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="display:flex;flex-direction:column;gap:3px"><span style="font:600 11px 'Public Sans',sans-serif;letter-spacing:.1em;color:#0C5F98">{{ r.k }}</span><span style="font:{{ r.fm }};color:{{ r.c }}">{{ r.t }}</span></span><span style="color:#0C5F98">→</span></div></sc-for></div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:520},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = !!this.props.mobile;
    const std = "500 18px 'IBM Plex Mono',monospace", sv = "600 20px/1.35 'Public Sans',sans-serif";
    const R = [['DỊCH VỤ', 'Tư vấn xây dựng ISO 50001'], ['TIÊU CHUẨN', 'ISO 50001:2018'], ['TÀI LIỆU', 'Checklist triển khai ISO 50001'], ['BÀI VIẾT', 'Energy Review là gì?'], ['NGÀNH', 'Thép & kim loại'], ['DỰ ÁN', '[CASE DATA]']];
    return { mobile: m, desktop: !m, rel: R.map(x => { const s = x[0] === 'TIÊU CHUẨN'; return { k: x[0], t: x[1], f: s ? std : sv, fm: s ? "500 15px 'IBM Plex Mono',monospace" : "600 17px/1.3 'Public Sans',sans-serif", c: s ? '#0C5F98' : '#282058' }; }) };
  }
}
</script>
</body>
</html>
