<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="background:#282058;color:#D2D0E6;padding:72px 96px 32px;display:flex;flex-direction:column;gap:48px;font-family:'Public Sans',sans-serif">
<div style="display:grid;grid-template-columns:4fr repeat(4,minmax(0,2fr));gap:48px"><div style="display:flex;flex-direction:column;gap:16px"><div style="background:#fff;padding:12px;align-self:flex-start"><img src="assets/leanwares-logo.jpg" style="height:72px;width:auto;display:block" alt="LEANWARES"></div><span style="font:400 13px 'Public Sans',sans-serif">Công ty Cổ phần LEANWARES</span></div>
<sc-for list="{{ mega }}" as="m" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:9px;font:400 14px 'Public Sans',sans-serif"><span style="color:#fff;font-weight:600">{{ m.t }}</span><sc-for list="{{ m.i }}" as="x" hint-placeholder-count="5"><span>{{ x }}</span></sc-for></div></sc-for></div>
<div style="border-top:1px solid #4A4380;padding-top:20px;display:flex;justify-content:space-between;font:400 12px 'IBM Plex Mono',monospace"><span>© LEANWARES</span><span>Điều khoản · Bảo mật</span></div>
</div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<div style="background:#282058;color:#D2D0E6;padding:44px 20px 24px;display:flex;flex-direction:column;gap:28px;font-family:'Public Sans',sans-serif"><div style="background:#fff;padding:10px;align-self:flex-start"><img src="assets/leanwares-logo.jpg" style="height:56px;width:auto;display:block" alt="LEANWARES"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><sc-for list="{{ mega }}" as="m" hint-placeholder-count="4"><div style="font:600 13px/1.5 'Public Sans',sans-serif;color:#fff;min-height:48px;display:flex;align-items:center">{{ m.t }}</div></sc-for></div>
<div style="border-top:1px solid #4A4380;padding-top:16px;font:400 11px 'IBM Plex Mono',monospace">© LEANWARES · Công ty Cổ phần LEANWARES</div></div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:420},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = !!this.props.mobile;
    return { mobile: m, desktop: !m, mega: [
      { t: 'Nhà máy xanh', i: ['Năng lượng', 'Nước', 'Nguyên liệu', 'Chất thải', 'Phát thải'] },
      { t: 'Sản phẩm xanh', i: ['Dấu chân carbon (carbon footprint)', 'Đánh giá vòng đời (LCA)', 'CBAM', 'Thiết kế sinh thái (eco-design)', 'Dữ liệu sản phẩm (product data)'] },
      { t: 'Chuỗi cung ứng xanh', i: ['Đánh giá ESG nhà cung cấp (supplier ESG)', 'Phạm vi 3 (Scope 3)', 'Truy xuất nguồn gốc', 'EUDR', 'Tìm nguồn bền vững (sustainable sourcing)'] },
      { t: 'Carbon & ESG', i: ['Carbon', 'ESG', 'Dữ liệu', 'Tiêu chuẩn'] }
    ] };
  }
}
</script>
</body>
</html>
